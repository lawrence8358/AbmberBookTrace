interface:
  display_name: "BookTrace 查書建檔"
  short_description: "查證書籍版本並補齊 BookTrace 資料與封面"
  default_prompt: "Use $booktrace-enrich-skill to verify this book and add or enrich it in BookTrace with the correct cover."

dependencies:
  tools:
    - type: "mcp"
      value: "booktrace"
      description: "BookTrace library tools"
      transport: "streamable_http"
      url: "https://booktrace.primeeagle.net/mcp"

policy:
  allow_implicit_invocation: true
