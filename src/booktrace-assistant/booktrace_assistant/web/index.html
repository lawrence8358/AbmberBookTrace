<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BookTrace 小幫手</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23272724'/%3E%3Ctext x='16' y='23' font-size='20' font-family='serif' font-weight='700' text-anchor='middle' fill='white'%3EB%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <button id="new-chat" class="icon-text-button" type="button" title="開始新對話">
          <span aria-hidden="true">＋</span><span>新對話</span>
        </button>
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">B</span>
          <div>
            <strong>BookTrace 小幫手</strong>
            <small>找書、認封面、加入書架</small>
          </div>
        </div>
        <div class="top-actions">
          <button id="model-badge" class="model-badge" type="button" title="模型設定">模型設定</button>
          <button id="open-settings" class="round-button" type="button" aria-label="設定" title="設定">⚙</button>
        </div>
      </header>

      <main id="chat" class="chat" aria-live="polite">
        <section id="welcome" class="welcome">
          <div class="welcome-icon" aria-hidden="true">B</div>
          <h1>想找哪一本書？</h1>
          <p>打書名、ISBN，或直接貼上一張書本照片。</p>
          <div class="suggestions">
            <button type="button" data-prompt="幫我查這本書的正確版本">查正確版本</button>
            <button type="button" data-prompt="幫我找這本書，找到後讓我確認再加入書架">找書並準備加入</button>
            <button type="button" data-prompt="這張照片裡是哪一本書？">從照片認書</button>
          </div>
        </section>
        <div id="messages" class="messages"></div>
      </main>

      <footer class="composer-wrap">
        <div id="status-bar" class="status-bar hidden">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="status-text">正在處理…</span>
          <span id="status-elapsed" class="status-elapsed"></span>
          <div class="status-actions">
            <button id="show-progress" class="show-progress hidden" type="button">查看進度</button>
            <button id="cancel-job" type="button">停止</button>
          </div>
        </div>
        <div id="drop-zone" class="composer">
          <div id="attachment-list" class="attachment-list"></div>
          <div class="composer-row">
            <button id="attach-button" class="composer-icon" type="button" aria-label="加入圖片" title="加入圖片">＋</button>
            <button id="batch-button" class="composer-icon batch-open" type="button" aria-label="一次查多本書" title="一次查多本書">≡</button>
            <input id="file-input" type="file" accept="image/jpeg,image/png,image/gif,image/webp" multiple hidden />
            <textarea id="message-input" rows="1" placeholder="輸入書名，或直接貼上圖片…" aria-label="訊息"></textarea>
            <button id="send-button" class="send-button" type="button" aria-label="送出" title="送出">↑</button>
          </div>
        </div>
        <p class="composer-hint">Enter 送出 · Shift + Enter 換行 · 可貼上或拖入圖片</p>
      </footer>
    </div>

    <dialog id="settings-dialog" class="dialog settings-dialog">
      <form method="dialog">
        <div class="dialog-head">
          <div>
            <h2>設定</h2>
            <p>選好後會記住，下次開啟沿用。</p>
          </div>
          <button class="dialog-close" value="cancel" aria-label="關閉">×</button>
        </div>
        <label>
          <span>使用的助理</span>
          <select id="engine-select"></select>
        </label>
        <label>
          <span>模型</span>
          <select id="model-select"></select>
        </label>
        <label id="custom-model-wrap" class="hidden">
          <span>模型 ID</span>
          <input id="custom-model" type="text" autocomplete="off" placeholder="例如：gpt-5.6-luna" />
        </label>
        <label>
          <span>思考深度</span>
          <select id="effort-select"></select>
          <small class="field-hint">想得越深越仔細，但會比較慢、比較花錢。</small>
        </label>
        <label class="toggle-row">
          <input id="auto-retry" type="checkbox" />
          <span>
            <strong>自動等待並重試</strong>
            <small>遇到 5 小時額度、服務忙碌或暫時斷線時持續等待</small>
          </span>
        </label>
        <section class="login-section" aria-labelledby="booktrace-login-title">
          <h3 id="booktrace-login-title">BookTrace 登入</h3>
          <p id="login-status" class="field-hint"></p>
          <label>
            <span>帳號</span>
            <input id="login-account" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" />
          </label>
          <label>
            <span>密碼</span>
            <input id="login-password" type="password" autocomplete="off" />
          </label>
          <p id="login-message" class="login-message" role="status"></p>
          <div class="login-actions">
            <button id="sign-in" type="button" class="secondary">登入</button>
            <button id="sign-out" type="button" class="secondary hidden">登出</button>
          </div>
        </section>
        <div class="dialog-actions">
          <button value="cancel" class="secondary">取消</button>
          <button id="save-settings" value="default" class="primary">儲存</button>
        </div>
      </form>
    </dialog>

    <dialog id="confirm-dialog" class="dialog confirm-dialog">
      <form method="dialog">
        <div class="confirm-icon" aria-hidden="true">✓</div>
        <h2>加入 BookTrace？</h2>
        <p id="confirm-text">確認版本與封面都正確後，才會寫入正式書架。</p>
        <div class="dialog-actions centered">
          <button value="cancel" class="secondary">再看一下</button>
          <button id="confirm-save" value="default" class="primary">確認加入</button>
        </div>
      </form>
    </dialog>

    <dialog id="batch-dialog" class="dialog batch-dialog">
      <form method="dialog">
        <div class="dialog-head">
          <div>
            <h2>一次查多本書</h2>
            <p>每一列是一本書：可以打書名或 ISBN，也可以附一張照片。最多 10 本，會同時開始查，查好的可以先加入書架。</p>
          </div>
          <button class="dialog-close" value="cancel" aria-label="關閉">×</button>
        </div>
        <div id="batch-rows" class="batch-rows"></div>
        <div class="batch-tools">
          <button id="batch-add-row" class="secondary" type="button">＋ 再加一本</button>
          <button id="batch-add-photos" class="secondary" type="button">選多張照片（一張一本）</button>
          <input id="batch-photo-input" type="file" accept="image/jpeg,image/png,image/gif,image/webp" multiple hidden />
        </div>
        <div class="dialog-actions">
          <button value="cancel" class="secondary">取消</button>
          <button id="batch-start" value="default" class="primary">開始查證</button>
        </div>
      </form>
    </dialog>

    <div id="toast" class="toast hidden" role="status"></div>

    <script src="/app.js"></script>
  </body>
</html>
