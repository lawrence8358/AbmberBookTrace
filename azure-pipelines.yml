trigger:
  branches:
    include:
      - main

# GitHub repositories use this trigger for pull requests. Azure Repos Git
# repositories should configure the same pipeline as a build-validation branch
# policy because their PR validation is controlled by branch policies.
pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-24.04

variables:
  nodeVersion: "22.x"
  pnpmVersion: "10"
  dotnetVersion: "10.x"
  buildConfiguration: "Release"
  artifactDirectory: "$(Build.ArtifactStagingDirectory)/booktrace-site"

steps:
  - checkout: self
    clean: true

  - task: UseNode@1
    displayName: Set up Node.js
    inputs:
      version: "$(nodeVersion)"

  - bash: npm install --global "pnpm@$(pnpmVersion)"
    displayName: Set up pnpm

  - task: UseDotNet@2
    displayName: Set up .NET
    inputs:
      packageType: sdk
      version: "$(dotnetVersion)"

  - bash: pnpm install --frozen-lockfile
    displayName: Install root Node.js dependencies

  - bash: pnpm install --frozen-lockfile
    displayName: Install frontend dependencies
    workingDirectory: src/booktrace-client

  - bash: pnpm build
    displayName: Build frontend

  - bash: dotnet restore src/BookTrace.Api/BookTrace.Api.csproj
    displayName: Restore API dependencies

  - bash: >-
      dotnet publish src/BookTrace.Api/BookTrace.Api.csproj
      --configuration $(buildConfiguration)
      --no-restore
      --output "$(artifactDirectory)"
    displayName: Publish single-site package

  - bash: test -f "$(artifactDirectory)/wwwroot/index.html"
    displayName: Verify frontend is included in the site package

  - task: PublishBuildArtifacts@1
    displayName: Upload downloadable build
    inputs:
      PathtoPublish: "$(artifactDirectory)"
      ArtifactName: "booktrace-site"
      publishLocation: Container
